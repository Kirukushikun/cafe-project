<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>System Navigator · Brew &amp; Bite Café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- Screens: index.html -->
<body data-module="index">
<template data-view="index" data-default data-title="System Navigator · Brew &amp; Bite Café" data-body-class="">
<header class="topbar">
  <div class="container">
    <a class="brand" href="index.html">
      <span class="brand-mark">B&amp;B</span>
      <span class="brand-name">Brew &amp; Bite Café</span>
    </a>
    <span class="chip chip-caramel">Mockup · sample data only</span>
  </div>
</header>

<main class="container">
  <div class="intro">
    <div class="eyebrow">System navigator</div>
    <h1>Jump to any screen in the system</h1>
    <p>This page is for demo and testing only. Customers never see it. In the real café, customers start by scanning the QR code on their table, and staff open their own screen after logging in.</p>
  </div>

  <section class="group">
    <div class="group-head">
      <div>
        <h2>Table QR codes</h2>
        <p>Each card stands in for the printed QR code on that table. Clicking one is the same as a customer scanning it: the menu opens already set to that table.</p>
      </div>
    </div>
    <div class="qr-grid" id="qrGrid"></div>
  </section>

  <section class="group">
    <div class="group-head">
      <div>
        <h2>All screens</h2>
        <p>Grouped by who uses them. Screens marked Planned are not built yet.</p>
      </div>
    </div>
    <div class="screens" id="screens"></div>
  </section>
</main>

<footer>
  <div class="container">
    <span>Brew &amp; Bite Café is a fictional business for a case study. All orders and payments are stored only in this browser.</span>
    <span class="reset">
      <span id="resetMsg" role="status"></span>
      <button class="btn btn-ghost" id="resetDemo" type="button">Reset demo data</button>
    </span>
  </div>
</footer>
</template>

<script src="js/app.js"></script>
</body>
</html>
