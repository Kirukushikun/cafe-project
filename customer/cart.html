<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Your order · Brew &amp; Bite Café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/customer.css">
</head>
<body class="customer">
<div class="app">
  <header class="c-bar">
    <a class="c-back" href="menu.html" aria-label="Back to menu">←</a>
    <h1>Your order</h1>
    <span class="session-pill" id="sessionPill"></span>
  </header>

  <div class="empty" id="empty" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h12v5a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/></svg>
    <h2>Your order is empty</h2>
    <p class="muted">Add a drink or a meal from the menu to get started.</p>
    <a class="btn btn-primary" href="menu.html">Browse the menu</a>
  </div>

  <div class="pad" id="content" hidden>
    <div class="card">
      <div class="card-head"><h2>Items</h2><a class="link-btn" href="menu.html">+ Add more</a></div>
      <div id="lines"></div>
    </div>

    <div class="card">
      <div class="sum">
        <div><span>Subtotal</span><span id="subtotal"></span></div>
        <div class="fine"><span>Vouchers, points and delivery fees are applied at checkout.</span></div>
      </div>
    </div>
  </div>
</div>

<div class="action-bar" id="actionBar" hidden>
  <a class="btn btn-primary" href="checkout.html" id="toCheckout">Continue to checkout</a>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/customer.js"></script>
<script>
(function () {
  if (!BBC.requireSession()) return;
  const $ = (id) => document.getElementById(id);

  function render() {
    const lines = BB.cart.lines();
    const empty = lines.length === 0;
    $('empty').hidden = !empty;
    $('content').hidden = empty;
    $('actionBar').hidden = empty;
    if (empty) return;

    $('lines').innerHTML = lines.map(l => `
      <div class="c-line" data-id="${l.id}">
        <span><b>${BBC.esc(l.name)}</b>
          ${BBC.optionText(l) ? `<small>${BBC.esc(BBC.optionText(l))}</small>` : ''}
          ${l.notes ? `<small><i>Note: ${BBC.esc(l.notes)}</i></small>` : ''}
          <small>${BB.peso(l.unitPrice, true)} each</small>
        </span>
        <span class="amt">${BB.peso(l.unitPrice * l.qty, true)}</span>
        <div class="stepper">
          <button type="button" data-act="minus" aria-label="Decrease ${BBC.esc(l.name)}">−</button>
          <output>${l.qty}</output>
          <button type="button" data-act="plus" aria-label="Increase ${BBC.esc(l.name)}">+</button>
        </div>
        <button type="button" class="link-btn remove" data-act="remove" style="color:var(--danger)">Remove</button>
      </div>`).join('');

    const total = BB.cart.total();
    $('subtotal').textContent = BB.peso(total, true);
    $('toCheckout').textContent = `Continue to checkout · ${BB.peso(total, true)}`;
  }

  $('lines').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const id = Number(btn.closest('.c-line').dataset.id);
    const line = BB.cart.lines().find(l => l.id === id);
    if (!line) return;
    if (btn.dataset.act === 'plus') BB.cart.setQty(id, Math.min(line.qty + 1, 20));
    if (btn.dataset.act === 'minus') BB.cart.setQty(id, line.qty - 1);
    if (btn.dataset.act === 'remove') { BB.cart.setQty(id, 0); BBC.toast(`Removed ${line.name}`); }
    render();
  });

  render();
})();
</script>
</body>
</html>
