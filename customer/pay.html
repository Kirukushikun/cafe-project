<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Payment · Brew &amp; Bite Café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../assets/css/app.css">
  <link rel="stylesheet" href="../assets/css/customer.css">
</head>
<body class="customer">
<div class="app" style="padding-bottom:0">
  <div class="wallet">
    <div class="wallet-top" id="top">
      <div class="row">
        <strong id="walletName" style="font-family:var(--display);font-size:1.2rem"></strong>
        <span class="sim-tag">SIMULATED</span>
      </div>
      <small>Pay merchant</small>
    </div>

    <div class="wallet-card">
      <div class="wallet-amt">
        <small>You are paying</small>
        <strong id="amount"></strong>
        <small>to <b>Brew &amp; Bite Café</b> · Tarlac City</small>
      </div>
      <div class="r-sep"></div>
      <dl class="kv">
        <dt>Order</dt><dd id="orderType"></dd>
        <dt>Items</dt><dd id="itemCount"></dd>
        <dt>Account</dt><dd id="account"></dd>
        <dt>Date</dt><dd id="when"></dd>
      </dl>
      <p class="wallet-note">This is a simulated payment for the demo. No real money moves and no payment provider is contacted. Tapping Pay saves the payment record and marks your order as paid.</p>
    </div>

    <div class="wallet-foot">
      <button class="btn" type="button" id="payBtn"></button>
      <a class="btn btn-ghost" href="checkout.html" id="cancelBtn">Cancel and go back</a>
    </div>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/customer.js"></script>
<script>
(function () {
  if (!BBC.requireSession()) return;
  const $ = (id) => document.getElementById(id);
  const draft = BB.get('draft', null);
  if (!draft || draft.method === 'CASH') { location.replace('checkout.html'); return; }

  const isGcash = draft.method === 'GCASH';
  const walletName = isGcash ? 'GCash' : 'Maya';
  $('top').classList.add(isGcash ? 'gcash' : 'maya');
  $('walletName').textContent = walletName;
  $('payBtn').classList.add(isGcash ? 'btn-gcash' : 'btn-maya');
  $('payBtn').textContent = `Pay ${BB.peso(draft.total, true)}`;
  $('amount').textContent = BB.peso(draft.total, true);
  $('orderType').textContent = BBC.orderTypeLabel(draft);
  $('itemCount').textContent = draft.items.reduce((n, l) => n + l.qty, 0) + ' item(s)';
  const m = draft.customer.mobile;
  $('account').textContent = m ? m.slice(0, 4) + ' ••• ' + m.slice(-4) : 'Demo wallet';
  $('when').textContent = BB.dateTime(new Date().toISOString());

  $('payBtn').addEventListener('click', () => {
    const btn = $('payBtn');
    btn.disabled = true;
    $('cancelBtn').hidden = true;
    btn.innerHTML = '<span class="processing" aria-hidden="true"></span> Processing payment';

    // Short pause so it feels like a wallet confirming; everything happens locally
    setTimeout(() => {
      const order = BB.orders.create(Object.assign({}, draft, { status: 'awaiting_payment' }));
      if (order.pointsUsed) BB.loyalty.add(order.customer.mobile, order.customer.name, -order.pointsUsed);
      BB.payments.record(order, draft.method);
      BB.cart.clear();
      BB.set('draft', null);
      BB.set('checkoutForm', {});
      location.replace('success.html?order=' + order.id);
    }, 1200);
  });
})();
</script>
</body>
</html>
