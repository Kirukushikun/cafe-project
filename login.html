<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Staff login · Brew &amp; Bite Café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- Screens: login.html -->
<body data-module="login" class="m-staff">
<template data-view="login" data-default data-title="Staff login · Brew &amp; Bite Café" data-body-class="">
<div class="login">
  <aside class="login-art">
    <a class="brand" href="index.html"><span class="brand-mark">B&amp;B</span><span class="brand-name">Brew &amp; Bite Café</span></a>
    <div>
      <h1>Good shift ahead.</h1>
      <p>Log in to open your screen: point of sale, kitchen display, inventory or the owner’s dashboard.</p>
    </div>
    <small>Staff only · every login is recorded in the audit log</small>
  </aside>

  <main class="login-form">
    <form class="login-card" id="form" novalidate>
      <h2>Staff login</h2>
      <p class="err" id="err" role="alert" hidden></p>
      <label class="lbl">Username<input class="input" id="username" autocomplete="username" required></label>
      <label class="lbl">Password<input class="input" id="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary" type="submit">Log in</button>

      <div class="demo-accts">
        <h3>Demo accounts · click to fill</h3>
        <div id="accts" style="display:grid;gap:6px"></div>
      </div>
    </form>
  </main>
</div>
</template>

<script src="js/app.js"></script>
</body>
</html>
