      <p class="lead">Espresso drinks pulled to order, brown sugar milk tea, all-day silog plates and pastries baked every morning. Come for a quick latte or stay the whole afternoon.</p>
      <div class="hero-actions">
        <a class="btn btn-primary" href="#visit">Visit us today</a>

<main>
  <section class="block" id="about">
    <div class="container about">
      <div>
        <div class="block-head">
          <div class="eyebrow">Our story</div>
          <h2>A neighborhood café for students, workers and barkadas</h2>
        </div>
        <p>Brew &amp; Bite started in 2022 as a small coffee counter near the city center. Today we have 14 tables, a full kitchen and a team of nine who know most of our regulars by name and by order.</p>
        <p>We use Benguet arabica for our espresso, Davao cacao for our chocolate drinks and fresh milk delivered every morning. Our rice meals are cooked the way we like them at home: generous, garlicky and served with atchara on the side.</p>
      </div>
      <div class="about-stats">
        <div><strong>60+</strong><span>items on the menu</span></div>
        <div><strong>14</strong><span>tables, about 44 seats</span></div>
        <div><strong>7 AM</strong><span>first shot pulled every day</span></div>
        <div><strong>4.8 ★</strong><span>average Facebook rating</span></div>
      </div>
    </div>
  </section>

  <section class="block" id="favorites" style="padding-top:0">
    <div class="container">
      <div class="block-head">
        <div class="eyebrow">Customer favorites</div>

        <p>Our best sellers and the newest additions to the menu.</p>
      </div>
      <div class="favs" id="favs"></div>
    </div>
  </section>

  <section class="block how" id="how">
    <div class="container">
      <div class="block-head">
        <div class="eyebrow">Dine with us</div>
        <h2>No more waiting in line to order</h2>
        <p>Every table has its own QR code. Order and pay from your phone, and we bring everything to your table.</p>
      </div>
      <div class="steps">
        <div><h3>Grab a table</h3><p>Find a seat. Each table has a QR code standee with its table number.</p></div>
        <div><h3>Scan and order</h3><p>Scan the code with your phone camera. Choose your size, sugar level and add-ons like oat milk or an extra shot.</p></div>
        <div><h3>Pay your way, we serve</h3><p>Pay on your phone or at the counter. Watch your order go from Preparing to Ready, then we bring it to you.</p>
          <div class="pay-row"><span class="chip chip-gcash">GCash</span><span class="chip chip-green">Maya</span><span class="chip chip-caramel">Cash</span></div>
        </div>
      </div>
    </div>
  </section>
