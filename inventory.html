<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ingredients · Brew &amp; Bite Café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- Screens: inventory.html · inventory.html?view=alerts · inventory.html?view=suppliers · inventory.html?view=purchase-orders · inventory.html?view=wastage -->
<body data-module="inventory" class="m-staff">
<template data-view="ingredients" data-default data-title="Ingredients · Brew &amp; Bite Café" data-body-class="staff">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="work">
    <header class="work-head">
      <div><h1>Ingredients</h1><div class="sub">Stock levels update automatically as orders are paid</div></div>
      <div style="display:flex;gap:10px;align-items:center"><span class="clock" id="clock"></span><button class="btn btn-primary btn-sm" type="button" id="addBtn">+ Add ingredient</button></div>
    </header>

    <div class="work-body">
      <div class="kpis" id="kpis"></div>

      <section class="panel">
        <div class="panel-head">
          <div class="tabs" id="tabs"></div>
          <div class="toolbar">
            <select class="input" id="cat" aria-label="Category"></select>
            <input class="input" id="search" type="search" placeholder="Search ingredients" aria-label="Search ingredients">
          </div>
        </div>
        <div class="tbl-wrap">
          <table class="tbl">
            <thead><tr><th>Ingredient</th><th>Category</th><th>In stock</th><th class="r">Reorder at</th><th class="r">Unit cost</th><th class="r">Stock value</th><th>Supplier</th><th>Status</th><th class="r"></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
</div>

<!-- Add / edit -->
<div class="modal-back" id="editBack" hidden>
  <form class="modal" id="editForm" role="dialog" aria-modal="true" aria-labelledby="eTitle" novalidate>
    <div class="modal-head"><h2 id="eTitle">Add ingredient</h2><button type="button" class="x-btn" data-close aria-label="Close">×</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <label class="lbl full">Name<input class="input" id="eName" required></label>
        <label class="lbl">Category<input class="input" id="eCat" list="catList" required></label>
        <label class="lbl">Unit<select class="input" id="eUnit"><option value="g">grams (g)</option><option value="ml">milliliters (ml)</option><option value="pc">pieces (pc)</option></select></label>
        <label class="lbl">Reorder level<input class="input" id="eReorder" type="number" min="0" step="any"></label>
        <label class="lbl">Reorder quantity<input class="input" id="eReorderQty" type="number" min="0" step="any"></label>
        <label class="lbl">Cost per unit (₱)<input class="input" id="eCost" type="number" min="0" step="0.001"></label>
        <label class="lbl">Supplier<select class="input" id="eSupplier"></select></label>
        <label class="lbl full" id="eStockWrap">Opening stock<input class="input" id="eStock" type="number" min="0" step="any" value="0"><span class="hint">To change stock later, use Wastage &amp; counts or receive a purchase order.</span></label>
      </div>
      <datalist id="catList"></datalist>
      <p class="err-msg" id="eErr" hidden></p>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" data-close>Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</div>

<!-- History -->
<div class="modal-back" id="histBack" hidden>
  <div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="hTitle">
    <div class="modal-head"><h2 id="hTitle"></h2><button type="button" class="x-btn" data-close aria-label="Close">×</button></div>
    <div class="modal-body" id="histBody"></div>
  </div>
</div>
</template>

<template data-view="alerts" data-title="Low-Stock Alerts · Brew &amp; Bite Café" data-body-class="staff">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="work">
    <header class="work-head">
      <div><h1>Low-stock alerts</h1><div class="sub">Ingredients at or below their reorder level, grouped by supplier</div></div>
      <span class="clock" id="clock"></span>
    </header>
    <div class="work-body" id="body"></div>
  </div>
</div>
</template>

<template data-view="suppliers" data-title="Suppliers · Brew &amp; Bite Café" data-body-class="staff">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="work">
    <header class="work-head">
      <div><h1>Suppliers</h1><div class="sub">Who we buy from and what they supply</div></div>
      <div style="display:flex;gap:10px;align-items:center"><span class="clock" id="clock"></span><button class="btn btn-primary btn-sm" type="button" id="addBtn">+ Add supplier</button></div>
    </header>
    <div class="work-body">
      <div class="toolbar"><input class="input grow" id="search" type="search" placeholder="Search suppliers or ingredients" style="max-width:340px" aria-label="Search suppliers"></div>
      <div class="sups" id="sups"></div>
    </div>
  </div>
</div>

<div class="modal-back" id="editBack" hidden>
  <form class="modal" id="editForm" role="dialog" aria-modal="true" aria-labelledby="eTitle" novalidate>
    <div class="modal-head"><h2 id="eTitle">Add supplier</h2><button type="button" class="x-btn" data-close aria-label="Close">×</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <label class="lbl full">Business name<input class="input" id="eName"></label>
        <label class="lbl">Contact person<input class="input" id="eContact"></label>
        <label class="lbl">Phone<input class="input" id="ePhone" placeholder="09XX XXX XXXX"></label>
        <label class="lbl full">Email<input class="input" id="eEmail" type="email"></label>
        <label class="lbl full">Address<input class="input" id="eAddress"></label>
        <label class="lbl">Delivery lead time (days)<input class="input" id="eLead" type="number" min="0" value="2"></label>
        <label class="lbl">Payment terms<select class="input" id="eTerms"><option>COD</option><option>7 days</option><option>15 days</option><option>30 days</option></select></label>
      </div>
      <p class="err-msg" id="eErr" hidden></p>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" data-close>Cancel</button>
      <button type="submit" class="btn btn-primary">Save supplier</button>
    </div>
  </form>
</div>
</template>

<template data-view="purchase-orders" data-title="Purchase Orders · Brew &amp; Bite Café" data-body-class="staff">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="work">
    <header class="work-head">
      <div><h1>Purchase orders</h1><div class="sub">Order from suppliers and receive deliveries into stock</div></div>
      <div style="display:flex;gap:10px;align-items:center"><span class="clock" id="clock"></span><button class="btn btn-primary btn-sm" type="button" id="newBtn">+ New purchase order</button></div>
    </header>
    <div class="work-body">
      <div class="kpis" id="kpis"></div>
      <section class="panel">
        <div class="panel-head"><div class="tabs" id="tabs"></div></div>
        <div class="tbl-wrap">
          <table class="tbl">
            <thead><tr><th>PO no.</th><th>Supplier</th><th>Items</th><th>Created</th><th>Expected</th><th class="r">Total</th><th>Status</th><th class="r"></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
</div>

<!-- New PO -->
<div class="modal-back" id="newBack" hidden>
  <form class="modal wide" id="newForm" role="dialog" aria-modal="true" aria-labelledby="nTitle" novalidate>
    <div class="modal-head"><h2 id="nTitle">New purchase order</h2><button type="button" class="x-btn" data-close aria-label="Close">×</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <label class="lbl">Supplier<select class="input" id="nSupplier"></select></label>
        <label class="lbl">Expected delivery<input class="input" id="nExpected" type="date"></label>
      </div>
      <div class="tbl-wrap" style="border:1px solid var(--line);border-radius:8px">
        <table class="tbl lines-tbl"><thead><tr><th>Ingredient</th><th>Quantity</th><th>Unit cost (₱)</th><th class="r">Amount</th><th></th></tr></thead><tbody id="nLines"></tbody></table>
      </div>
      <button type="button" class="btn btn-ghost btn-sm" id="addLine" style="justify-self:start">+ Add line</button>
      <label class="lbl">Notes for the supplier<input class="input" id="nNotes" placeholder="Optional"></label>
      <div class="po-total"><span>Total</span><span id="nTotal">₱0.00</span></div>
      <p class="err-msg" id="nErr" hidden></p>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" data-close>Cancel</button>
      <button type="submit" class="btn btn-ghost" data-status="draft">Save as draft</button>
      <button type="submit" class="btn btn-primary" data-status="sent">Save and mark as sent</button>
    </div>
  </form>
</div>

<!-- View / receive -->
<div class="modal-back" id="viewBack" hidden>
  <form class="modal wide" id="viewForm" role="dialog" aria-modal="true" aria-labelledby="vTitle" novalidate>
    <div class="modal-head"><h2 id="vTitle"></h2><button type="button" class="x-btn" data-close aria-label="Close">×</button></div>
    <div class="modal-body" id="vBody"></div>
    <div class="modal-foot" id="vFoot"></div>
  </form>
</div>
</template>

<template data-view="wastage" data-title="Wastage &amp; Stock Counts · Brew &amp; Bite Café" data-body-class="staff">
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="work">
    <header class="work-head">
      <div><h1>Wastage &amp; stock counts</h1><div class="sub">Record what was thrown away and correct stock after a physical count</div></div>
      <span class="clock" id="clock"></span>
    </header>
    <div class="work-body">
      <div class="kpis" id="kpis"></div>

      <div class="forms">
        <!-- Wastage -->
        <form class="panel panel-pad" id="wForm" novalidate>
          <div class="card-head" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
            <h2>Log wastage</h2>
            <div class="seg" role="radiogroup" aria-label="What was wasted">
              <label><input type="radio" name="wKind" value="ing" checked> Ingredient</label>
              <label><input type="radio" name="wKind" value="item"> Menu item</label>
            </div>
          </div>
          <label class="lbl" id="wIngWrap">Ingredient<select class="input" id="wIng"></select></label>
          <label class="lbl" id="wItemWrap" hidden>Menu item (uses its recipe, Medium size)<select class="input" id="wItem"></select></label>
          <div class="form-grid">
            <label class="lbl">Quantity<span class="unit-input"><input class="input" id="wQty" type="number" min="0" step="any"><span id="wUnit"></span></span></label>
            <label class="lbl">Reason<select class="input" id="wReason"></select></label>
            <label class="lbl full">Note<input class="input" id="wNote" placeholder="Optional, e.g. milk past expiry date"></label>
          </div>
          <div class="preview" id="wPreview"></div>
          <p class="err-msg" id="wErr" hidden></p>
          <button class="btn btn-primary" type="submit">Record wastage</button>
        </form>

        <!-- Stock count -->
        <form class="panel panel-pad" id="cForm" novalidate>
          <h2>Stock count</h2>
          <p class="hint">Count what is physically on the shelf. The system stock is corrected to match and the difference is recorded.</p>
          <label class="lbl">Ingredient<select class="input" id="cIng"></select></label>
          <label class="lbl">Counted quantity<span class="unit-input"><input class="input" id="cQty" type="number" min="0" step="any"><span id="cUnit"></span></span></label>
          <div class="preview" id="cPreview"></div>
          <p class="err-msg" id="cErr" hidden></p>
          <button class="btn btn-primary" type="submit">Save count</button>
        </form>
      </div>

      <section class="panel">
        <div class="panel-head">
          <h2>History</h2>
          <div class="tabs" id="tabs"></div>
        </div>
        <div class="tbl-wrap">
          <table class="tbl">
            <thead><tr><th>When</th><th>Type</th><th>Ingredient</th><th class="r">Change</th><th class="r">Cost</th><th>Reason / note</th><th>By</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
</div>
</template>

<script src="js/app.js"></script>
</body>
</html>
